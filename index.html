<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#065F46" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="synth. — every data signal, one platform. A unified data surface for coaches and athletes." />

    <!-- Open Graph link preview. og:image is a 1200x630 card with
         the synth icon centered + small on a cobalt canvas, so
         iMessage / Slack / Twitter / Facebook render a calm preview
         instead of the full-bleed solid emerald the PWA icon used to
         produce. Width + height meta let renderers reserve layout
         without re-fetching the file. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="synth. — Every data signal. One platform." />
    <meta property="og:description" content="A unified data surface for coaches and athletes. Connect every tool your program uses, synthesize the data, and see one clear picture." />
    <meta property="og:image" content="/logos/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="synth." />

    <!-- Twitter Card. summary_large_image picks up the new landscape
         OG card. iMessage / Slack ignore this hint and use the og:*
         tags above regardless. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="synth. — Every data signal. One platform." />
    <meta name="twitter:description" content="A unified data surface for coaches and athletes. Connect every tool your program uses, synthesize the data, and see one clear picture." />
    <meta name="twitter:image" content="/logos/og-card.png" />

    <!-- Favicons (web) -->
    <link rel="icon" type="image/svg+xml" href="/logos/synth-icon-green.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logos/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logos/icon-512.png" />

    <!-- iOS home-screen / Safari PWA -->
    <link rel="apple-touch-icon" sizes="180x180" href="/logos/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logos/icon-152.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="synth." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700;800&display=swap" />
    <title>synth. — Every data signal. One platform.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
