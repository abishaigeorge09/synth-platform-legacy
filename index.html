<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#065F46" media="(prefers-color-scheme: dark)" />

    <!-- SEO. Copy mirrors the landing hero ("Unlock every signal. Push
         past every limit.") so the SERP snippet, share preview, and
         landing page read as one consistent brand surface. We deliberately
         drop connector tool names from the description — the value prop
         is the unified picture, not the brand wall. -->
    <meta name="description" content="Unlock every signal. Push past every limit. synth is the data layer for athletes. One clear picture of training, recovery, and life." />
    <link rel="canonical" href="https://synthsports.co/" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="author" content="synth." />

    <!-- Open Graph link preview. og:image is a 1200×630 hero-photo card
         with a dark gradient and the brand line baked in — replaces the
         old cobalt-blue tile that rendered as a giant solid blue with a
         tiny icon when iMessage / WhatsApp blew it up full-bleed. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://synthsports.co/" />
    <meta property="og:title" content="synth · unlock every signal. push past every limit." />
    <meta property="og:description" content="Unlock every signal. Push past every limit. synth is the data layer for athletes. One clear picture of training, recovery, and life." />
    <meta property="og:image" content="https://synthsports.co/logos/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="synth — unlock every signal" />
    <meta property="og:site_name" content="synth." />

    <!-- Twitter Card. summary_large_image picks up the landscape
         OG card. iMessage / Slack ignore this hint and use the og:*
         tags above regardless. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="synth · unlock every signal. push past every limit." />
    <meta name="twitter:description" content="Unlock every signal. Push past every limit. synth is the data layer for athletes. One clear picture of training, recovery, and life." />
    <meta name="twitter:image" content="https://synthsports.co/logos/og-card.png" />
    <meta name="twitter:image:alt" content="synth — unlock every signal" />

    <!-- Favicons (web) -->
    <link rel="icon" type="image/svg+xml" href="/logos/synth-icon-green.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logos/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logos/icon-512.png" />

    <!-- iOS home-screen / Safari PWA -->
    <link rel="apple-touch-icon" sizes="180x180" href="/logos/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logos/icon-152.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="synth." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700;800&display=swap" />
    <title>synth · unlock every signal. push past every limit.</title>

    <!-- Structured data: tells Google this is a software product so the
         SERP can render a sitelinks search box, brand chip, and (in
         time) review/rating snippets. URL must match the canonical. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "synth.",
      "description": "Unlock every signal. Push past every limit. synth is the data layer for athletes. One clear picture of training, recovery, and life.",
      "url": "https://synthsports.co/",
      "applicationCategory": "SportsApplication",
      "operatingSystem": "Web, iOS, Android",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "image": "https://synthsports.co/logos/og-card.png",
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
