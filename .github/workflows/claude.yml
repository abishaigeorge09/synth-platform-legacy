name: Claude Auto-Review & Fix

on:
  # Trigger automatically on every PR — no @claude mention needed
  pull_request:
    types: [opened, synchronize, reopened]
  # Also allow manual trigger via @claude comment
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-review-and-fix:
    # Run on every PR, or only on @claude comment triggers
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest

    permissions:
      contents: write        # push fixes back to the branch
      pull-requests: write   # post review comments + approve
      issues: write          # comment on issues
      checks: read           # read CI status

    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Run autonomously on PRs without waiting for @claude mention
          trigger_phrase: "@claude"

          # System prompt: what Claude should do on every PR
          system_prompt: |
            You are an autonomous code reviewer and fixer for the synth-platform repository.

            On every pull request, you must:
            1. Review all changed files for correctness, type safety, and consistency with the existing codebase
            2. Check that the code follows the patterns in CLAUDE.md (CSS variables, THEME tokens, no hardcoded colors)
            3. If you find fixable issues (TypeScript errors, broken imports, wrong variable names, missing theme vars), fix them directly by editing the files and pushing to the PR branch
            4. If the code is clean, approve the PR with a brief summary of what it does
            5. If there are issues you cannot auto-fix (e.g. architectural decisions, missing requirements), leave clear comments explaining what the author needs to do

            Rules:
            - Always run `npx tsc --noEmit` after making any code changes to verify TypeScript passes
            - Never break the existing dark-mode CSS variable system (var(--bg-primary), var(--text-primary), etc.)
            - Never hardcode colors — always use THEME.* tokens or CSS variables
            - Keep the synth. emerald/dark design language intact
            - When fixing, prefer minimal targeted changes over large rewrites

          # Let Claude make edits and push them back to the PR branch
          allowed_tools: "Bash,Edit,Write,Read,Glob,Grep"
